name: PR cleanup

# PR đã merge → xoá nhánh (dự phòng khi "Automatically delete head branches" chưa bật hoặc merge tay).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            && echo "Đã xoá nhánh $BRANCH" || echo "Nhánh $BRANCH đã được xoá trước đó"
